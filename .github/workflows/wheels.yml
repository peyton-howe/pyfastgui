# Release wheels (M8 / 6B).
#
# Two wheels per OS: one `cp311-abi3` for every GIL CPython >= 3.11, and one `cp314t` for the
# free-threaded build (abi3t needs CPython 3.15+; PyO3 0.29 does not build 3.13t).
#
# CI runners have no GPU, so the smoke job only proves the wheel installs, imports, and passes
# the headless test suite. Opening a real window from the wheel on one GPU per OS is a manual
# release step (see ROADMAP.md, M8).
#
# Publishing: push a tag `vX.Y.ZrcN` -> TestPyPI, `vX.Y.Z` -> PyPI. Both use trusted publishing;
# configure the `testpypi` / `pypi` environments and the PyPI trusted publisher before tagging.

name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/fastgui-py/Cargo.toml"
      - ".github/workflows/wheels.yml"

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform.name }} ${{ matrix.flavor.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: windows-x64, runner: windows-latest, target: x64 }
          - { name: macos-arm64, runner: macos-14, target: aarch64 }
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
        flavor:
          - { name: abi3, python: "3.11", abi3: true }
          - { name: cp314t, python: "3.14t", abi3: false }
    steps:
      - uses: actions/checkout@v4
      # Linux builds inside the manylinux container, which already ships every interpreter.
      - uses: actions/setup-python@v5
        id: py
        if: runner.os != 'Linux'
        with:
          python-version: ${{ matrix.flavor.python }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # winit, ash and the rfd xdg-portal backend dlopen/D-Bus at runtime; nothing links
          # GTK or Vulkan at build time, so 2_28 is only about the glibc floor.
          manylinux: "2_28"
          # abi3 needs no interpreter. cp314t: the container's `python3.14t` on Linux, the exact
          # setup-python interpreter elsewhere.
          args: --release --out dist ${{ matrix.flavor.abi3 && '--features abi3' || format('-i {0}', runner.os == 'Linux' && 'python3.14t' || steps.py.outputs.python-path) }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}-${{ matrix.flavor.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  smoke:
    name: smoke ${{ matrix.platform.name }} ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: windows-x64, runner: windows-latest }
          - { name: macos-arm64, runner: macos-14 }
          - { name: linux-x86_64, runner: ubuntu-latest }
        # Oldest and newest GIL builds exercise the abi3 wheel; 3.14t the free-threaded one.
        python: ["3.11", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-${{ matrix.platform.name }}-*
          merge-multiple: true
          path: dist
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # pip picks whichever of the two wheels matches this interpreter.
          python -m pip install --no-index --find-links dist pyfastgui
          python -m pip install pytest numpy
      - name: Import and test from the installed wheel
        shell: bash
        # Copy the tests out of the checkout: run in place, pytest would put ./python on sys.path
        # (python/tests is a package) and `import fastgui` would hit the source tree, not the wheel.
        working-directory: ${{ runner.temp }}
        run: |
          cp -r "$GITHUB_WORKSPACE/python/tests" fastgui_tests
          python -c "import sys, fastgui; print(sys.version, getattr(sys, '_is_gil_enabled', lambda: True)(), fastgui.__file__)"
          python -m pytest -q -p no:cacheprovider fastgui_tests

  publish:
    needs: [wheels, sdist, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, 'rc') && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: contains(github.ref_name, 'rc')
        with:
          repository-url: https://test.pypi.org/legacy/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ !contains(github.ref_name, 'rc') }}
