[package]
name = "fastgui-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared winit ApplicationHandler: dock/float/ghost input + command queue"

[dependencies]
fastgui-core = { path = "../fastgui-core" }
fastgui-chrome = { path = "../fastgui-chrome" }
crossbeam-channel = "0.5"
winit = "0.30"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
