[package]
name = "fastgui-render-vk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fastgui-app = { path = "../fastgui-app" }
fastgui-chrome = { path = "../fastgui-chrome" }
fastgui-core = { path = "../fastgui-core" }
crossbeam-channel = "0.5"
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
thiserror = "2"

[dev-dependencies]
fastgui-chrome = { path = "../fastgui-chrome", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_Security", "Win32_System_Threading"] }
