[package]
name = "fastgui-render-mtl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Everything is macOS-only: `objc-sys` refuses to build without an Objective-C runtime, so
# unconditional deps broke `cargo test --workspace` on Windows/Linux. Elsewhere this crate
# compiles to an empty lib (see `#![cfg]` in src/lib.rs); `fastgui-py` only depends on it
# under the same cfg.
[target.'cfg(target_os = "macos")'.dependencies]
fastgui-app = { path = "../fastgui-app" }
fastgui-chrome = { path = "../fastgui-chrome" }
fastgui-core = { path = "../fastgui-core" }
crossbeam-channel = "0.5"
raw-window-handle = "0.6"
winit = "0.30"
thiserror = "2"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["all"] }
objc2-app-kit = { version = "0.2", features = ["all"] }
objc2-quartz-core = { version = "0.2", features = ["all"] }
objc2-metal = { version = "0.2", features = ["all"] }
